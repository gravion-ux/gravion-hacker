[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gravion-hacker"
version = "1.1.0"
description = "Authorized, offline-first security assessment suite by Priyanshu Kumar Thakur"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Priyanshu Kumar Thakur" }]
dependencies = []

[project.scripts]
gravion-hacker = "gravion_hacker.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
